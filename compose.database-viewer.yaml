# Local desktop database browser. Start with the main Compose file; see
# docs/07-setup-and-deployment/DATABASE-VIEWER.md.
services:
  pgadmin:
    image: dpage/pgadmin4:9.18@sha256:c332c5f6dfba995d9ebc4af261d93506d6876085d712eaaa3defc8dd1a3f26de
    restart: unless-stopped
    ports:
      - "127.0.0.1:5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: pgadmin4@pgadmin.org
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/pgadmin-password
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_DISABLE_POSTFIX: "1"
    secrets:
      - source: pgadmin-password
        target: pgadmin-password
    configs:
      - source: pgadmin-servers
        target: /pgadmin4/servers.json
        mode: 0444
      - source: pgadmin-pgpass
        target: /config/pgpass
        uid: "5050"
        gid: "5050"
        mode: 0400
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres: {condition: service_healthy}

configs:
  pgadmin-servers:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "Enterprise PPM - Local database",
            "Group": "Servers",
            "Host": "postgres",
            "Port": 5432,
            "MaintenanceDB": "ppm_local",
            "Username": "postgres",
            "SSLMode": "prefer",
            "PassFile": "/config/pgpass"
          }
        }
      }
  pgadmin-pgpass:
    content: |
      postgres:5432:*:postgres:${PPM_POSTGRES_PASSWORD:?Existing project .env is required}

secrets:
  pgadmin-password:
    file: ./artifacts/local/pgadmin-password.txt

volumes:
  pgadmin_data:
