[project]
name = "enterprise-ppm"
version = "0.1.0"
description = "Enterprise PPM Sprint 01 foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "pydantic-settings==2.15.0",
  "sqlalchemy[asyncio]==2.0.54",
  "asyncpg==0.31.0",
  "alembic==1.20.0",
  "redis==6.4.0",
  "celery[redis]==5.6.3",
  "bcrypt==5.0.0",
  "pyjwt==2.15.0",
  "email-validator==2.3.0",
  "pypdf==6.20.1",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "httpx==0.28.1", "ruff==0.16.10", "mypy==1.20.2", "pyyaml==6.0.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["services/api", "services/worker", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires the isolated Compose test database and Redis", "worker: requires a live Linux Celery worker"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "services/api:services/worker"
explicit_package_bases = true
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

